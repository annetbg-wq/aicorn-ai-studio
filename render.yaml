services:
  - type: web
    name: aicorn-ai-studio-backend
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci
    startCommand: npx tsx backend/auth-token.ts
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: AIC_SERVER_MODE
        value: production
      - key: AIC_ALLOWED_ORIGINS
        value: https://annetbg-wq.github.io
      # Secrets — set these in the Render dashboard after the first deploy.
      # Only the providers you actually use need a value; the rest can stay empty.
      - key: AIC_DEV_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

  # Superadmin MCP — a separate service on purpose: its own bearer-auth boundary,
  # its own (much more powerful) credentials, independently deployable/restartable,
  # and none of the arbitrary-code-execution surface preview compilation above has.
  # Not a public API. See mcp-server/README.md and DEPLOYMENT.md before touching this.
  - type: web
    name: aicorn-ai-studio-mcp
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    rootDir: mcp-server
    buildCommand: npm ci
    startCommand: npx tsx src/index.ts
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: GITHUB_OWNER
        value: annetbg-wq
      - key: GITHUB_REPO
        value: aicorn-ai-studio
      - key: BACKEND_HEALTH_URL
        value: https://aicorn-ai-studio-backend.onrender.com/health
      - key: PAGES_URL
        value: https://annetbg-wq.github.io/aicorn-ai-studio/
      # RENDER_BACKEND_SERVICE_ID is optional — deploy_* tools look the service
      # up by name if it's unset. Only add it if you ever rename that service.
      # Secrets — set these in the Render dashboard after the first deploy.
      # None of these are ever returned through any MCP tool response.
      - key: MCP_BEARER_TOKEN
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: RENDER_API_KEY
        sync: false
