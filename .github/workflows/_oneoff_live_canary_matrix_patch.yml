name: One-off live canary prompt patch

on:
  push:
    branches: [test/live-preview-canary-matrix]
    paths: [.github/workflows/_oneoff_live_canary_matrix_patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/live-preview-canary-matrix
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Make live canary prompt configurable
        shell: python
        run: |
          from pathlib import Path
          p = Path('e2e/chat-generation-flow.spec.cjs')
          s = p.read_text()
          old = "const LIVE_CANARY_PROMPT = 'landing page for a simple counter product';"
          new = "const LIVE_CANARY_PROMPT = process.env.LIVE_CANARY_PROMPT ?? 'landing page for a simple counter product';"
          if old not in s:
            raise SystemExit('live canary prompt constant not found')
          p.write_text(s.replace(old, new))
      - name: Commit E2E patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/chat-generation-flow.spec.cjs
          git commit -m "test: make live canary prompt configurable"
          git push origin HEAD:test/live-preview-canary-matrix
