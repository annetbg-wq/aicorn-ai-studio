name: Stage 6 Exhaustive Fix
on:
  push:
    branches: [feat/super-app-first-class-skeleton]
    paths: ['.github/stage6_exhaustive_fix.py', '.github/workflows/stage6-exhaustive-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/super-app-first-class-skeleton
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python .github/stage6_exhaustive_fix.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete super-app exhaustive contracts"
          git push origin HEAD:feat/super-app-first-class-skeleton
