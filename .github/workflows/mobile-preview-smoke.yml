name: Mobile Preview Smoke
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  mobile-preview-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            preview-workspace/package.json
      - name: Install root dependencies
        run: npm ci
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Install preview workspace dependencies
        run: npm install --prefix preview-workspace --no-package-lock
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile validator real preview smoke
        env:
          PLAYWRIGHT_PRODUCTION_ARTIFACT: '1'
        run: npx playwright test e2e/mobile-validator-preview.spec.cjs
