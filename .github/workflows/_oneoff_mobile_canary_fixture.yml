name: One-off mobile canary fixture
on:
  push:
    branches:
      - test/live-preview-canary-matrix
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/live-preview-canary-matrix
      - name: Patch mobile canary fixture
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          rm .github/workflows/_oneoff_mobile_canary_fixture.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add e2e/chat-generation-flow.spec.cjs .github/workflows/_oneoff_mobile_canary_fixture.yml
          git commit -m 'test: make mobile canary coder fixture contract-aware'
          git push origin HEAD:test/live-preview-canary-matrix
