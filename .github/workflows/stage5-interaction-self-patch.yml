name: Stage 5 Interaction Self Patch

on:
  push:
    branches:
      - refactor/app-first-quality-gate
    paths:
      - .github/stage5_interaction_patch.py
      - .github/workflows/stage5-interaction-self-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/app-first-quality-gate
          fetch-depth: 0
      - name: Add mobile interaction proof
        run: python .github/stage5_interaction_patch.py
      - name: Self-clean patch machinery
        run: rm .github/stage5_interaction_patch.py .github/workflows/stage5-interaction-self-patch.yml
      - name: Commit strengthened E2E
        run: |
          git config user.name "annetbg-wq"
          git config user.email "annetdenr@gmail.com"
          git add -A
          git commit -m "test: prove mobile navigation and actions end to end"
          git push origin HEAD:refactor/app-first-quality-gate
