name: Step 7 Unit Debug

on:
  push:
    branches:
      - tmp/step7-unit-debug
    paths:
      - .github/workflows/step7-unit-debug.yml

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/step7-unit-debug
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run full unit suite and capture output
        shell: bash
        run: |
          set +e
          cd frontend
          npm test > ../step7-unit-failure.log 2>&1
          status=$?
          cd ..
          echo "TEST_EXIT_CODE=$status" >> step7-unit-failure.log
          echo '--- UNIT FAILURE SUMMARY ---'
          grep -E -A8 -B3 'FAIL|AssertionError|Test Files|Tests |Error:' step7-unit-failure.log | tail -n 240 || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f step7-unit-failure.log
          git commit -m 'chore: capture Step 7 unit diagnostics'
          git push origin HEAD:tmp/step7-unit-debug
          exit 0
