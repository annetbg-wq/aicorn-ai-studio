name: One-off finish compiled prompt consumer

on:
  push:
    branches:
      - refactor/skeleton-compiled-runtime-contract

permissions:
  contents: write

jobs:
  apply:
    if: "!contains(github.event.head_commit.message, 'finish compiled prompt consumer')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/skeleton-compiled-runtime-contract
          fetch-depth: 0
      - name: Apply migration
        run: python scripts/_oneoff_finish_compiled_prompt.py
      - name: Commit clean result
        run: |
          rm scripts/_oneoff_finish_compiled_prompt.py
          rm .github/workflows/_oneoff_finish_compiled_prompt.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/services/SkeletonRegistry.ts scripts/_oneoff_finish_compiled_prompt.py .github/workflows/_oneoff_finish_compiled_prompt.yml
          git commit -m "refactor: finish compiled prompt consumer"
          git push
