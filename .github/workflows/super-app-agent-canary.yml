name: Super App Agent Canary

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  super-app-agent-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            preview-workspace/package.json
      - name: Install root dependencies
        run: npm ci
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Install preview workspace dependencies
        run: npm install --prefix preview-workspace --no-package-lock
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run multi-domain super-app full agent canary
        env:
          PLAYWRIGHT_PRODUCTION_ARTIFACT: '1'
          VITE_OPENROUTER_API_KEY: e2e-super-app-key
        run: npx playwright test e2e/super-app-agent-generation.spec.cjs
      - name: Upload super-app diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: super-app-agent-canary-diagnostics
          path: test-results/
          if-no-files-found: warn
          retention-days: 3
