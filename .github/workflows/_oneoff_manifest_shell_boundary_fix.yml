name: One-off manifest shell boundary fix

on:
  push:
    branches: [test/live-preview-canary-matrix]
    paths: [.github/workflows/_oneoff_manifest_shell_boundary_fix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/live-preview-canary-matrix
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch validator and canary fast-fail
        shell: python
        run: |
          from pathlib import Path
          import base64
          dec = lambda value: base64.b64decode(value).decode()
          validator = Path('frontend/src/services/LiveGenerationContractValidator.ts')
          source = validator.read_text()
          old = dec('')
          new = dec('')
          if old not in source: raise SystemExit('validator block not found')
          validator.write_text(source.replace(old, new))
          Path('frontend/src/services/__tests__/LiveGenerationContractManifestOwnership.test.ts').write_text(dec(''))
          e2e = Path('e2e/chat-generation-flow.spec.cjs')
          source = e2e.read_text()
          old = dec('ICAgICAgICBjb25zdCBzID0gYm9keT8uc3RhdHVzOwogICAgICAgIGlmIChzICE9PSBfbGFzdFN0YXR1c1NlZW4pIHsKICAgICAgICAgIGNvbnNvbGUubG9nKGBDQU5BUllfU1RFUDogYnVpbGRfc3RhdHVzXyR7c31gKTsKICAgICAgICAgIF9sYXN0U3RhdHVzU2VlbiA9IHM7CiAgICAgICAgfQogICAgICAgIGV4cGVjdChzKS50b0JlKCdyZWFkeScpOwo=')
          new = dec('')
          if old not in source: raise SystemExit('canary status block not found')
          e2e.write_text(source.replace(old, new))
      - name: Remove one-off workflow
        run: rm .github/workflows/_oneoff_manifest_shell_boundary_fix.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/services/LiveGenerationContractValidator.ts frontend/src/services/__tests__/LiveGenerationContractManifestOwnership.test.ts e2e/chat-generation-flow.spec.cjs .github/workflows/_oneoff_manifest_shell_boundary_fix.yml
          git commit -m "fix: honor manifest product slots at shell boundary"
          git push origin HEAD:test/live-preview-canary-matrix
