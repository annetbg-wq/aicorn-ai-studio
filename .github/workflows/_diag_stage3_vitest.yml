name: Diagnostic Stage3 Vitest

on:
  push:
    branches:
      - refactor/skeleton-compiled-runtime-contract

permissions:
  contents: read

jobs:
  vitest-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - name: Run verbose frontend tests
        shell: bash
        run: |
          set +e
          npm test --prefix frontend -- --run --reporter=verbose 2>&1 | tee vitest-stage3.log
          code=${PIPESTATUS[0]}
          echo "VITEST_EXIT_CODE=$code" >> "$GITHUB_ENV"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: stage3-vitest-log
          path: vitest-stage3.log
      - name: Preserve failing conclusion
        run: |
          test "$VITEST_EXIT_CODE" = "0"
