name: One-off fix intent specificity arbitration

on:
  push:
    branches:
      - refactor/skeleton-selection-manifest-compatibility
    paths:
      - .github/workflows/_oneoff_fix_intent_specificity.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/skeleton-selection-manifest-compatibility
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add semantic intent specificity
        shell: python
        run: |
          from pathlib import Path
          p = Path('frontend/src/services/SkeletonRegistry.ts')
          s = p.read_text()

          s = s.replace(
            "const INTENT_SIGNAL_GROUPS: ReadonlyArray<{ signal: string; keywords: string[] }> = [",
            "const INTENT_SIGNAL_GROUPS: ReadonlyArray<{ signal: string; keywords: string[]; specificity?: number }> = [",
          )
          s = s.replace(
            "    signal: 'game-intent',\n    keywords: ['game', 'rpg', 'progression', 'levels', 'leaderboard', 'score', 'puzzle', 'arcade', 'quest', 'player', 'achievements', 'gamification'],",
            "    signal: 'game-intent',\n    // Explicit game vocabulary is a domain-defining signal, unlike generic\n    // analytics/dashboard vocabulary that commonly appears inside games too.\n    // Specificity affects only intent arbitration; skeleton fit still comes\n    // exclusively from the manifest selectionContract.\n    specificity: 2,\n    keywords: ['game', 'rpg', 'progression', 'levels', 'leaderboard', 'score', 'puzzle', 'arcade', 'quest', 'player', 'achievements', 'gamification'],",
          )

          anchor = "function detectIntentSignalMatches(input: string): Array<{ signal: string; matchedKeywords: string[] }> {\n"
          helper = "function getIntentSignalSpecificity(signal: string): number {\n  return INTENT_SIGNAL_GROUPS.find(group => group.signal === signal)?.specificity ?? 0;\n}\n\n"
          if helper not in s:
            s = s.replace(anchor, helper + anchor)

          old = """  const strongestSignalEvidence = intentSignalMatches.reduce(\n    (max, match) => Math.max(max, match.matchedKeywords.length),\n    0,\n  );\n  const arbitrationSignals = weakFallback\n    ? intentSignals\n    : intentSignalMatches\n        .filter(match => match.matchedKeywords.length === strongestSignalEvidence)\n        .map(match => match.signal);\n"""
          new = """  const arbitrationStrength = (match: { signal: string; matchedKeywords: string[] }) =>\n    match.matchedKeywords.length + getIntentSignalSpecificity(match.signal);\n  const strongestSignalEvidence = intentSignalMatches.reduce(\n    (max, match) => Math.max(max, arbitrationStrength(match)),\n    0,\n  );\n  const arbitrationSignals = weakFallback\n    ? intentSignals\n    : intentSignalMatches\n        .filter(match => arbitrationStrength(match) === strongestSignalEvidence)\n        .map(match => match.signal);\n"""
          if old not in s:
            raise SystemExit('expected arbitration block not found')
          s = s.replace(old, new)

          old_doc = """ * Override fires only when:\n *   - At least one intent signal is present (not an ambiguous prompt)\n *   - At least one mismatch warning is present (not an already-correct selection)\n *   - The original selected skeleton is in the rule's bad-selections set\n *   - The preferred override target is available in the registry\n"""
          new_doc = """ * Override fires only when:\n *   - At least one intent signal is present (not an ambiguous prompt)\n *   - At least one mismatch warning is present (not an already-correct selection)\n *   - Manifest compatibility marks the original selection incompatible\n *   - A manifest-compatible preferred target is available in the registry\n"""
          s = s.replace(old_doc, new_doc)
          p.write_text(s)

      - name: Remove one-off workflow
        run: rm .github/workflows/_oneoff_fix_intent_specificity.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/services/SkeletonRegistry.ts .github/workflows/_oneoff_fix_intent_specificity.yml
          git commit -m "fix: arbitrate explicit game intent by semantic specificity"
          git push origin HEAD:refactor/skeleton-selection-manifest-compatibility
