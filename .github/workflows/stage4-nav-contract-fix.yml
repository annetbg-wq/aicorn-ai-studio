name: Stage4 Nav Contract Fix
on:
  push:
    branches: [refactor/product-delta-generation]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/product-delta-generation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Patch coder navigation contract
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path('frontend/src/services/SkeletonContractForCoder.ts')
          text = p.read_text()

          old = """  const optionalProductSlots = compiled.optionalSlots;\n  const nav = NAV_CONTRACTS[skeletonId];\n  const lines: string[] = [];"""
          new = """  const optionalProductSlots = compiled.optionalSlots;\n  const nav = NAV_CONTRACTS[skeletonId];\n  const productSlotPaths = new Set([...requiredProductSlots, ...optionalProductSlots]);\n  const navConfigProductSlotPath = `${nav.configPath.replace(/^@\\//, 'src/')}.ts`;\n  const navConfigIsProductSlot = productSlotPaths.has(navConfigProductSlotPath);\n  const lines: string[] = [];"""
          if text.count(old) != 1:
              raise SystemExit('nav setup anchor mismatch')
          text = text.replace(old, new)

          old = """  if (nav.exports.length > 0) {\n    lines.push('  Exports (read-only):');"""
          new = """  if (nav.exports.length > 0) {\n    lines.push(\n      navConfigIsProductSlot\n        ? `  Product-slot exports — define these in ${navConfigProductSlotPath}:`\n        : '  Exports (read-only):',\n    );"""
          if text.count(old) != 1:
              raise SystemExit('nav exports anchor mismatch')
          text = text.replace(old, new)

          old = """  if (nav.rules.length > 0) {\n    lines.push('  Rules:');\n    for (const rule of nav.rules) {\n      lines.push(`    • ${rule}`);\n    }\n  }"""
          new = """  const effectiveNavRules = navConfigIsProductSlot\n    ? nav.rules.filter(rule => !/read-only|do NOT re-(?:declare|export|import)/i.test(rule))\n    : nav.rules;\n  if (navConfigIsProductSlot) {\n    lines.push(\n      `  Product-slot rule: ${navConfigProductSlotPath} is writable product configuration; ` +\n        'emit the listed exports there. The navigation rendering component itself remains skeleton-owned.',\n    );\n  }\n  if (effectiveNavRules.length > 0) {\n    lines.push('  Rules:');\n    for (const rule of effectiveNavRules) {\n      lines.push(`    • ${rule}`);\n    }\n  }"""
          if text.count(old) != 1:
              raise SystemExit('nav rules anchor mismatch')
          text = text.replace(old, new)
          p.write_text(text)

          t = Path('frontend/src/services/__tests__/ProductDeltaContract.test.ts')
          test = t.read_text()
          import_anchor = "} from '../ProductDeltaContract';\n"
          if "buildSkeletonContractForCoder" not in test:
              test = test.replace(
                  import_anchor,
                  import_anchor + "import { buildSkeletonContractForCoder } from '../SkeletonContractForCoder';\n",
                  1,
              )
          closing = "\n});\n"
          case = """\n  it('makes writable navigation product slots authoritative over legacy read-only wording', () => {\n    const contract = buildSkeletonContractForCoder('mobile-app');\n\n    expect(contract).toContain('Product-slot exports — define these in src/config/navigation.ts');\n    expect(contract).toContain('src/config/navigation.ts is writable product configuration');\n    expect(contract).not.toContain('BOTTOM_TABS is read-only');\n    expect(contract).toContain('Import BottomTabs from @/components/BottomTabs');\n  });\n"""
          if case.strip() not in test:
              idx = test.rfind(closing)
              if idx < 0:
                  raise SystemExit('test closing anchor missing')
              test = test[:idx] + case + test[idx:]
          t.write_text(test)
          PY
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Verify targeted contract
        working-directory: frontend
        env:
          VITE_OPENROUTER_API_KEY: placeholder
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
        run: |
          npx tsc --noEmit
          npx vitest run src/services/__tests__/ProductDeltaContract.test.ts src/services/__tests__/SkeletonDeterministicMatrixSmoke.test.ts
      - name: Commit clean fix and remove temporary workflow
        shell: bash
        run: |
          rm -f node_modules
          rm -f .github/workflows/stage4-nav-contract-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/services/SkeletonContractForCoder.ts frontend/src/services/__tests__/ProductDeltaContract.test.ts
          git add -u .github/workflows/stage4-nav-contract-fix.yml
          git commit -m "fix: make product-slot navigation contract authoritative"
          git push origin HEAD:refactor/product-delta-generation
