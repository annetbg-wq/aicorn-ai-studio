name: Step 7 Contract Refactor Helper

on:
  push:
    branches:
      - tmp/step7-contract-refactor
    paths:
      - .github/workflows/step7-refactor-helper.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/step7-contract-refactor
          fetch-depth: 0

      - name: Apply mechanical compiler migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def load(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def save(path: str, text: str) -> None:
              Path(path).write_text(text, encoding='utf-8')

          def replace_exact(text: str, old: str, new: str, label: str, expected: int = 1) -> str:
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f'{label}: expected {expected} exact match(es), found {actual}')
              return text.replace(old, new)

          def replace_call(text: str, name: str, replacement, label: str, expected: int | None = None) -> str:
              pattern = re.compile(rf'{re.escape(name)}\(([^()\n]+)\)')
              matches = list(pattern.finditer(text))
              if expected is not None and len(matches) != expected:
                  raise SystemExit(f'{label}: expected {expected} call(s), found {len(matches)}')
              if not matches:
                  raise SystemExit(f'{label}: no calls found')
              return pattern.sub(lambda m: replacement(m.group(1).strip()), text)

          proto_path = 'frontend/src/services/ProtoPipeline.ts'
          proto = load(proto_path)
          for legacy_import in (
              '  getEditableSkeletonFiles,\n',
              '  getSkeletonInstalledFiles,\n',
              '  getSkeletonProductSlotFiles,\n',
          ):
              proto = replace_exact(proto, legacy_import, '', f'ProtoPipeline import {legacy_import.strip()}')
          proto = replace_exact(
              proto,
              "import { getSkeletonQualityContract } from './SkeletonQualityContract';\n",
              "import { compileSkeletonContract } from './SkeletonContractCompiler';\n",
              'ProtoPipeline quality import',
          )
          proto = replace_call(proto, 'getEditableSkeletonFiles', lambda arg: f'compileSkeletonContract({arg}).editable', 'ProtoPipeline editable access', 3)
          proto = replace_call(proto, 'getSkeletonInstalledFiles', lambda arg: f'compileSkeletonContract({arg}).infrastructure.installed', 'ProtoPipeline installed access', 4)
          proto = replace_call(proto, 'getSkeletonProductSlotFiles', lambda arg: f'getProductDeltaScope({arg}).allowed', 'ProtoPipeline product-slot access', 3)
          proto = replace_call(proto, 'getSkeletonQualityContract', lambda arg: f'compileSkeletonContract({arg}).quality', 'ProtoPipeline quality access', 1)
          save(proto_path, proto)

          validator_path = 'frontend/src/services/LiveGenerationContractValidator.ts'
          validator = load(validator_path)
          validator = replace_exact(
              validator,
              "import {\n  getSkeletonInstalledFiles,\n  getSkeletonProductSlotFiles,\n  getRequiredSkeletonDataFiles,\n  isProtectedSkeletonFile,\n  type SkeletonId,\n} from './SkeletonRegistry';\n",
              "import { isProtectedSkeletonFile, type SkeletonId } from './SkeletonRegistry';\nimport { compileSkeletonContract } from './SkeletonContractCompiler';\nimport { getProductDeltaScope } from './ProductDeltaContract';\n",
              'LiveGenerationContractValidator imports',
          )
          unique_sorted = "function uniqueSorted(values: Iterable<string>): string[] {\n  return Array.from(new Set(Array.from(values))).sort((left, right) => left.localeCompare(right));\n}\n"
          data_helper = unique_sorted + "\nfunction getRequiredSkeletonDataFilesFromContract(skeletonId: SkeletonId): string[] {\n  const contract = compileSkeletonContract(skeletonId);\n  const candidates = [\n    ...contract.infrastructure.installed,\n    ...contract.requiredSlots,\n    ...contract.optionalSlots,\n    ...contract.editable,\n  ];\n  return uniqueSorted(candidates.filter(file => (\n    file === 'src/data/seed.ts' || file === 'src/data/types.ts'\n  )));\n}\n"
          validator = replace_exact(validator, unique_sorted, data_helper, 'LiveGenerationContractValidator data helper insertion')
          validator = replace_call(validator, 'getSkeletonInstalledFiles', lambda arg: f'compileSkeletonContract({arg}).infrastructure.installed', 'LiveGenerationContractValidator installed access')
          validator = replace_call(validator, 'getSkeletonProductSlotFiles', lambda arg: f'getProductDeltaScope({arg}).allowed', 'LiveGenerationContractValidator product-slot access')
          validator = replace_call(validator, 'getRequiredSkeletonDataFiles', lambda arg: f'getRequiredSkeletonDataFilesFromContract({arg})', 'LiveGenerationContractValidator data access', 1)
          save(validator_path, validator)

          preflight_path = 'frontend/src/modules/quality/LiveReadinessPreflight.ts'
          preflight = load(preflight_path)
          preflight = replace_exact(
              preflight,
              "import {\n  SKELETON_REGISTRY,\n  getSkeletonInstalledFiles,\n  type SkeletonId,\n} from '../../services/SkeletonRegistry';\n",
              "import { SKELETON_REGISTRY, type SkeletonId } from '../../services/SkeletonRegistry';\nimport { compileSkeletonContract } from '../../services/SkeletonContractCompiler';\n",
              'LiveReadinessPreflight imports',
          )
          preflight = replace_call(preflight, 'getSkeletonInstalledFiles', lambda arg: f'compileSkeletonContract({arg}).infrastructure.installed', 'LiveReadinessPreflight installed access', 1)
          save(preflight_path, preflight)

          registry_path = 'frontend/src/services/SkeletonRegistry.ts'
          registry = load(registry_path)
          registry_pattern = re.compile(
              r'export function getSkeletonInstalledFiles\(skeletonId: SkeletonId\): string\[\] \{.*?'
              r'export function getRequiredSkeletonDataFiles\(skeletonId: SkeletonId\): string\[\] \{.*?\n\}\n\n(?=/\*\*\n \* Returns true)',
              re.S,
          )
          registry, removed = registry_pattern.subn('', registry)
          if removed != 1:
              raise SystemExit(f'SkeletonRegistry ownership accessor block: expected 1 block, removed {removed}')
          save(registry_path, registry)

          quality_wrapper = Path('frontend/src/services/SkeletonQualityContract.ts')
          if not quality_wrapper.exists():
              raise SystemExit('SkeletonQualityContract.ts missing before planned deletion')
          quality_wrapper.unlink()
          PY

      - name: Assert legacy accessors are gone
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E 'getSkeletonInstalledFiles|getEditableSkeletonFiles|getSkeletonProductSlotFiles|getRequiredSkeletonDataFiles|getSkeletonQualityContract' -- frontend/src; then
            echo 'Legacy skeleton accessor reference remains.' >&2
            exit 1
          fi
          git diff --check
          git status --short

      - name: Commit refactor to temporary branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/services/ProtoPipeline.ts \
                  frontend/src/services/LiveGenerationContractValidator.ts \
                  frontend/src/modules/quality/LiveReadinessPreflight.ts \
                  frontend/src/services/SkeletonRegistry.ts \
                  frontend/src/services/SkeletonQualityContract.ts
          git commit -m 'refactor(skeletons): collapse ownership accessors into compiler contract'
          git push origin HEAD:tmp/step7-contract-refactor
