name: One-off fix selection override arbitration

on:
  push:
    branches:
      - refactor/skeleton-selection-manifest-compatibility
    paths:
      - .github/workflows/_oneoff_fix_selection_override_arbitration.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/skeleton-selection-manifest-compatibility
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch confident-selection arbitration
        shell: python
        run: |
          from pathlib import Path
          p = Path('frontend/src/services/SkeletonRegistry.ts')
          s = p.read_text()
          old = '''  const weakFallback = originalSelectedSkeletonId === 'mobile-app' && bestScore < 2;\n\n  for (const signal of intentSignals) {\n    const evaluation = evaluateSkeletonIntentCompatibility({\n'''
          new = '''  const weakFallback = originalSelectedSkeletonId === 'mobile-app' && bestScore < 2;\n\n  // A confident tag-based selection must not be overturned by a weaker incidental\n  // intent signal. Only the strongest detected signal tier may challenge it.\n  // Ties stay eligible: e.g. a game brief can deliberately override a dashboard\n  // when game and dashboard evidence are equally strong. Weak fallbacks remain\n  // rescuable by any recognized manifest-backed intent.\n  const strongestSignalEvidence = intentSignalMatches.reduce(\n    (max, match) => Math.max(max, match.matchedKeywords.length),\n    0,\n  );\n  const arbitrationSignals = weakFallback\n    ? intentSignals\n    : intentSignalMatches\n        .filter(match => match.matchedKeywords.length === strongestSignalEvidence)\n        .map(match => match.signal);\n\n  for (const signal of arbitrationSignals) {\n    const evaluation = evaluateSkeletonIntentCompatibility({\n'''
          if old not in s:
            raise SystemExit('target arbitration block not found')
          p.write_text(s.replace(old, new))

      - name: Remove one-off workflow
        run: rm .github/workflows/_oneoff_fix_selection_override_arbitration.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/services/SkeletonRegistry.ts .github/workflows/_oneoff_fix_selection_override_arbitration.yml
          git commit -m "fix: arbitrate confident skeleton overrides by strongest intent"
          git push origin HEAD:refactor/skeleton-selection-manifest-compatibility
