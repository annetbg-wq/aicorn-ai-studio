name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  # BenchmarkGate suite: 'smoke' (5 intents, fast) or 'full' (15 intents)
  BENCHMARK_SUITE: ${{ vars.BENCHMARK_SUITE || 'smoke' }}

jobs:
  # ── Type check + unit tests ────────────────────────────────────────────────
  test:
    name: TypeScript + Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test
        env:
          VITE_OPENROUTER_API_KEY: placeholder   # tests must not require real keys

      - name: Preview stability smoke-pack (required)
        run: npm run test -- previewStabilityPack.test.ts
        env:
          VITE_OPENROUTER_API_KEY: placeholder

  # ── Production build ───────────────────────────────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL:      ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

  # ── BenchmarkGate quality gate ─────────────────────────────────────────────
  # Runs only when OPENROUTER_API_KEY is available (set as a repository secret).
  # Skipped automatically on forks and branches without the secret.
  benchmark:
    name: BenchmarkGate (${{ vars.BENCHMARK_SUITE || 'smoke' }})
    runs-on: ubuntu-latest
    needs: build
    if: ${{ secrets.OPENROUTER_API_KEY != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run BenchmarkGate
        working-directory: frontend
        run: node --experimental-vm-modules scripts/benchmark-gate.mjs
        env:
          OPENROUTER_API_KEY:     ${{ secrets.OPENROUTER_API_KEY }}
          BENCHMARK_MODEL_ID:     ${{ vars.BENCHMARK_MODEL_ID || 'openai/gpt-4o-mini' }}
          BENCHMARK_SUITE:        ${{ vars.BENCHMARK_SUITE || 'smoke' }}
          VITE_SUPABASE_URL:      ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
