name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

env:
  BENCHMARK_SUITE:    smoke
  BENCHMARK_MODEL_ID: openai/gpt-4o-mini

jobs:
  mcp:
    name: MCP TypeScript + Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test
        env:
          MCP_BEARER_TOKEN: ci-test-bearer-token

  # ── Type check + unit tests ────────────────────────────────────────────────
  test:
    name: TypeScript + Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test
        env:
          VITE_OPENROUTER_API_KEY: placeholder
          VITE_SUPABASE_URL:       https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY:  placeholder-anon-key

      - name: Preview baseline smoke (required)
        run: npm run test:smoke
        env:
          VITE_OPENROUTER_API_KEY: placeholder
          VITE_SUPABASE_URL:       https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY:  placeholder-anon-key

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL:      https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key

  preview-live-canary:
    name: Live Preview Canary
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            preview-workspace/package.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install preview workspace dependencies
        run: npm install --prefix preview-workspace --no-package-lock

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run representative live preview canary matrix
        shell: bash
        env:
          PLAYWRIGHT_PRODUCTION_ARTIFACT: '1'
          VITE_OPENROUTER_API_KEY: e2e-live-preview-key
        run: |
          set -euo pipefail
          run_case() {
            local case_id="$1"
            local prompt="$2"
            echo "::group::Live Preview Canary — ${case_id}"
            LIVE_CANARY_PROMPT="${prompt}" npm run test:e2e:preview-live
            echo "::endgroup::"
          }

          run_case "landing-page" "Build a launch-ready SaaS marketing landing page with hero, pricing, testimonials, FAQ and a primary Start free CTA."
          run_case "mobile-app" "Build a mobile consumer habit tracking app with onboarding, bottom tab navigation, home feed, detail screen, create action, progress and profile."
          run_case "saas-dashboard" "Build a B2B SaaS admin analytics dashboard with sidebar navigation, KPI metrics, reports, data table and settings."
          run_case "ecommerce" "Build an ecommerce storefront with product catalog, search, product detail, wishlist, cart, checkout and account screens."

      - name: Upload live preview diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-preview-canary-diagnostics
          path: test-results/
          if-no-files-found: warn
          retention-days: 3

  benchmark:
    name: BenchmarkGate
    runs-on: ubuntu-latest
    needs: build
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Skip BenchmarkGate when key is missing
        if: env.OPENROUTER_API_KEY == ''
        run: |
          echo "BenchmarkGate skipped: OPENROUTER_API_KEY is not configured."

      - name: Run BenchmarkGate
        if: env.OPENROUTER_API_KEY != ''
        working-directory: frontend
        run: node --experimental-vm-modules scripts/benchmark-gate.mjs
        env:
          OPENROUTER_API_KEY:     ${{ env.OPENROUTER_API_KEY }}
          BENCHMARK_MODEL_ID:     ${{ env.BENCHMARK_MODEL_ID }}
          BENCHMARK_SUITE:        ${{ env.BENCHMARK_SUITE }}
          VITE_SUPABASE_URL:      https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
