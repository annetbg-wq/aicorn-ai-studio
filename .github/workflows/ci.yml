name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

env:
  BENCHMARK_SUITE:    smoke
  BENCHMARK_MODEL_ID: openai/gpt-4o-mini

jobs:
  # ── Type check + unit tests ────────────────────────────────────────────────
  test:
    name: TypeScript + Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test
        env:
          VITE_OPENROUTER_API_KEY: placeholder   # tests must not require real keys
          VITE_SUPABASE_URL:       https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY:  placeholder-anon-key

      - name: Preview baseline smoke (required)
        run: npm run test:smoke
        env:
          VITE_OPENROUTER_API_KEY: placeholder
          VITE_SUPABASE_URL:       https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY:  placeholder-anon-key

  # ── Production build ───────────────────────────────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL:      https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key

  # ── Live preview release canary ───────────────────────────────────────────
  preview-live-canary:
    name: Live Preview Canary
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            preview-workspace/package.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install preview workspace dependencies
        run: npm install --prefix preview-workspace --no-package-lock

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run live preview canary
        run: npm run test:e2e:preview-live
        env:
          PLAYWRIGHT_PRODUCTION_ARTIFACT: '1'
          VITE_OPENROUTER_API_KEY: e2e-live-preview-key

  # ── BenchmarkGate quality gate ─────────────────────────────────────────────
  # Skips gracefully when OPENROUTER_API_KEY is absent (forks, branches without the secret).
  benchmark:
    name: BenchmarkGate
    runs-on: ubuntu-latest
    needs: build
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Skip BenchmarkGate when key is missing
        if: env.OPENROUTER_API_KEY == ''
        run: |
          echo "BenchmarkGate skipped: OPENROUTER_API_KEY is not configured."

      - name: Run BenchmarkGate
        if: env.OPENROUTER_API_KEY != ''
        working-directory: frontend
        run: node --experimental-vm-modules scripts/benchmark-gate.mjs
        env:
          OPENROUTER_API_KEY:     ${{ env.OPENROUTER_API_KEY }}
          BENCHMARK_MODEL_ID:     ${{ env.BENCHMARK_MODEL_ID }}
          BENCHMARK_SUITE:        ${{ env.BENCHMARK_SUITE }}
          VITE_SUPABASE_URL:      https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
