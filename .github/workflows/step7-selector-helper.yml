name: Step 7 Canonical Selector Helper

on:
  push:
    branches:
      - tmp/step7-canonical-selector
    paths:
      - .github/workflows/step7-selector-helper.yml
      - .github/step7-selector-refactor.py

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/step7-canonical-selector
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply canonical selector refactor
        run: python .github/step7-selector-refactor.py

      - name: Align manifest invariant assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/services/__tests__/SkeletonSelectionManifestRuntime.test.ts')
          text = path.read_text(encoding='utf-8')
          old = "compileSkeletonContract('saas-dashboard').selection.incompatibleArchetypes).toContain('gaming')"
          new = "compileSkeletonContract('saas-dashboard').selection.incompatibleArchetypes).toContain('interactive-game')"
          if text.count(old) != 1:
              raise SystemExit('expected saas-dashboard incompatibility assertion not found exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Selection regression tests
        working-directory: frontend
        run: npm test -- --run src/services/__tests__/SkeletonSelectionCanonical.test.ts src/services/__tests__/SkeletonSelectionBaseSemantics.test.ts src/services/__tests__/SkeletonSelectionManifestRuntime.test.ts src/services/__tests__/SkeletonSelectionWeightedConflict.test.ts
        env:
          VITE_OPENROUTER_API_KEY: placeholder
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Assert compatibility shim is gone
        run: |
          test ! -e frontend/src/services/SkeletonSelectionCompatibility.ts
          test ! -e frontend/src/services/__tests__/SkeletonSelectionCompatibility.test.ts
          if git grep -n "SkeletonSelectionCompatibility\|selectSkeletonWithSafeOverrides\|evaluateSkeletonIntentCompatibility" -- frontend/src; then
            echo "Legacy selection compatibility reference remains." >&2
            exit 1
          fi
          git diff --check

      - name: Commit canonical selector refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/services/SkeletonRegistry.ts \
                  frontend/src/services/SimpleGeneration.ts \
                  frontend/src/services/SkeletonSelectionCompatibility.ts \
                  frontend/src/services/__tests__/SkeletonSelectionCompatibility.test.ts \
                  frontend/src/services/__tests__/SkeletonSelectionSafeOverrides.test.ts \
                  frontend/src/services/__tests__/SkeletonSelectionCanonical.test.ts \
                  frontend/src/services/__tests__/SkeletonSelectionBaseSemantics.test.ts \
                  frontend/src/services/__tests__/SkeletonSelectionManifestRuntime.test.ts \
                  frontend/src/services/__tests__/SkeletonSelectionWeightedConflict.test.ts
          git commit -m 'refactor(skeletons): collapse compatibility override into canonical selector'
          git push origin HEAD:tmp/step7-canonical-selector
