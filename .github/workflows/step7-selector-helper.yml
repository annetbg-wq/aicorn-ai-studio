name: Step 7 Canonical Selector Helper

on:
  push:
    branches:
      - tmp/step7-canonical-selector
    paths:
      - .github/workflows/step7-selector-helper.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/step7-canonical-selector
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Collapse selection compatibility into canonical selector
        shell: bash
        run: |
          python - <<'PY'
