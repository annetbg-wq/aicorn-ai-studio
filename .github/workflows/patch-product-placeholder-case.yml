name: Patch PRODUCT Placeholder Case

on:
  push:
    branches:
      - fix/live-preview-bootstrap-iframe

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-preview-bootstrap-iframe
          fetch-depth: 0
      - name: Patch production detector
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/services/ProtoPipeline.ts')
          text = path.read_text()
          old = "  { label: 'PRODUCT', rx: /\\bPRODUCT\\b/i },"
          new = "  { label: 'PRODUCT', rx: /\\bPRODUCT\\b/ },"
          if old not in text:
              raise SystemExit('PRODUCT placeholder rule anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-product-placeholder-case.yml
          git add frontend/src/services/ProtoPipeline.ts
          git commit -m "fix(preview): distinguish PRODUCT token from product copy"
          git push origin HEAD:fix/live-preview-bootstrap-iframe
