name: One-off fix Registry consumers
on:
  push:
    branches: [refactor/skeleton-registry-canonical-runtime]
    paths: ['.github/workflows/_oneoff_fix_registry_consumers.yml']
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/skeleton-registry-canonical-runtime
      - name: Switch remaining consumers to manifest ownership
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('frontend/src/shared/outputTruth.ts')
          s = p.read_text()
          s = s.replace("  SKELETON_REGISTRY,\n  getSkeletonInstalledFiles,", "  getSkeletonInstalledFiles,\n  getSkeletonProductSlotFiles,")
          old = "  const skeletonDeltaClasses = skeletonId\n    ? getStructureClassesForPaths(SKELETON_REGISTRY[skeletonId].deltaFiles.map(normalizeProjectPath), previewEntryFile)\n        .filter((id) => id !== 'root-shell' && id !== 'styles-theme')\n    : [];"
          new = "  const skeletonProductSlots = skeletonId\n    ? getSkeletonProductSlotFiles(skeletonId).map(normalizeProjectPath)\n    : [];\n  const skeletonDeltaClasses = skeletonId\n    ? getStructureClassesForPaths(skeletonProductSlots, previewEntryFile)\n        .filter((id) => id !== 'root-shell' && id !== 'styles-theme')\n    : [];"
          if old not in s: raise SystemExit('outputTruth classes block not found')
          s = s.replace(old, new)
          s = s.replace("Math.ceil(SKELETON_REGISTRY[skeletonId].deltaFiles.length * 0.4)", "Math.ceil(skeletonProductSlots.length * 0.4)")
          s = s.replace("countMatchingPaths(SKELETON_REGISTRY[skeletonId].deltaFiles, (path) => isPageLikePath(normalizeProjectPath(path)))", "countMatchingPaths(skeletonProductSlots, (path) => isPageLikePath(normalizeProjectPath(path)))")
          if 'SKELETON_REGISTRY[skeletonId].deltaFiles' in s:
              raise SystemExit('outputTruth legacy delta reference remains')
          p.write_text(s)

          p = Path('frontend/src/services/__tests__/SaasDashboardNavigationContract.test.ts')
          s = p.read_text()
          s = s.replace("import { SKELETON_REGISTRY } from '../SkeletonRegistry';", "import { getSkeletonProductSlotFiles } from '../SkeletonRegistry';")
          s = s.replace("   6. The navigation.ts is listed in the skeleton's deltaFiles so the coder sees", "   6. The navigation.ts is a required product slot so the coder sees")
          s = s.replace("  it('navigation.ts is listed in deltaFiles so coder sees both nav shapes', () => {\n    const manifest = saasDashboardManifest as { deltaFiles: string[] };\n    expect(manifest.deltaFiles).toContain('src/config/navigation.ts');\n  });\n\n  it('skeleton registry deltaFiles for saas-dashboard includes navigation.ts', () => {\n    expect(SKELETON_REGISTRY['saas-dashboard'].deltaFiles).toContain('src/config/navigation.ts');\n  });", "  it('navigation.ts is a required product slot so coder sees both nav shapes', () => {\n    const manifest = saasDashboardManifest as { ownership: { requiredProductSlots: string[] } };\n    expect(manifest.ownership.requiredProductSlots).toContain('src/config/navigation.ts');\n  });\n\n  it('runtime product-slot adapter for saas-dashboard includes navigation.ts', () => {\n    expect(getSkeletonProductSlotFiles('saas-dashboard')).toContain('src/config/navigation.ts');\n  });")
          p.write_text(s)

          p = Path('frontend/src/services/__tests__/SkeletonRegistry.manifests.test.ts')
          s = p.read_text()
          s = s.replace("  SKELETON_REGISTRY,\n", "  getSkeletonProductSlotFiles,\n")
          s = s.replace("  editableFiles: string[];\n  deltaFiles: string[];", "  ownership: {\n    requiredProductSlots: string[];\n    optionalProductSlots: string[];\n    agentEditable: string[];\n  };")
          s = s.replace("  it('keeps registry deltaFiles in sync with manifests and all physical product pages', () => {", "  it('keeps required product slots in sync with all physical product pages', () => {")
          s = s.replace("      expect(sortPaths(manifest.deltaFiles), `${id} manifest deltaFiles mismatch`).toEqual(expectedDeltaFiles);\n      expect(sortPaths(manifest.editableFiles), `${id} manifest editableFiles mismatch`).toEqual(expectedDeltaFiles);\n      expect(sortPaths(SKELETON_REGISTRY[id].deltaFiles), `${id} registry deltaFiles mismatch`).toEqual(expectedDeltaFiles);", "      expect(sortPaths(manifest.ownership.requiredProductSlots), `${id} requiredProductSlots mismatch`).toEqual(expectedDeltaFiles);\n      expect(sortPaths(manifest.ownership.agentEditable), `${id} agentEditable mismatch`).toEqual(expectedDeltaFiles);\n      expect(sortPaths(getSkeletonProductSlotFiles(id)), `${id} runtime product slots mismatch`).toEqual(expectedDeltaFiles);")
          s = s.replace("      for (const deltaFile of manifest.deltaFiles) {\n        expect(promptBlock, `${id} prompt missing delta file ${deltaFile}`).toContain(deltaFile);", "      for (const deltaFile of manifest.ownership.requiredProductSlots) {\n        expect(promptBlock, `${id} prompt missing required product slot ${deltaFile}`).toContain(deltaFile);")
          if '.deltaFiles' in s or 'editableFiles' in s or 'SKELETON_REGISTRY' in s:
              raise SystemExit('SkeletonRegistry.manifests legacy reference remains')
          p.write_text(s)
          PY
          rm .github/workflows/_oneoff_fix_registry_consumers.yml
      - name: Commit consumer migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/shared/outputTruth.ts frontend/src/services/__tests__/SaasDashboardNavigationContract.test.ts frontend/src/services/__tests__/SkeletonRegistry.manifests.test.ts .github/workflows/_oneoff_fix_registry_consumers.yml
          git commit -m 'refactor: switch Registry consumers to manifest ownership'
          git push origin HEAD:refactor/skeleton-registry-canonical-runtime
