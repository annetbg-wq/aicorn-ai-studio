name: Apply preview invariant patch

on:
  push:
    branches: [refactor/validator-infrastructure-boundary]
    paths: [.github/workflows/_oneoff_apply_preview_invariant.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/validator-infrastructure-boundary
          fetch-depth: 0
      - run: node scripts/_tmp_patch_preview_ready_invariant.mjs
      - run: git rm .github/workflows/_oneoff_apply_preview_invariant.yml scripts/_tmp_patch_preview_ready_invariant.mjs
      - run: git config user.name github-actions[bot]
      - run: git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - run: git add backend/preview-manager.ts && git commit -m "fix: require preview artifact before ready" && git push origin HEAD:refactor/validator-infrastructure-boundary
