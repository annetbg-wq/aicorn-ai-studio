name: Stage4 Anchor Fix

on:
  push:
    branches:
      - refactor/product-delta-generation

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/product-delta-generation
          fetch-depth: 0
      - name: Normalize exact patch anchor and self-remove
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('frontend/src/services/SkeletonContractForCoder.ts')
          text = p.read_text()
          old = """  lines.push(
    '  4. Do NOT recreate the app shell, router, providers, or skeleton foundation files.',
  );"""
          new = "  lines.push('  4. Do NOT recreate the app shell, router, providers, or skeleton foundation files.');"
          if old in text:
              p.write_text(text.replace(old, new, 1))
          Path('.github/workflows/stage4-anchor-fix.yml').unlink(missing_ok=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: normalize stage 4 patch anchor"
          git push origin HEAD:refactor/product-delta-generation
