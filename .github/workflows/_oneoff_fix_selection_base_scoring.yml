name: One-off fix skeleton selection base scoring

on:
  push:
    branches:
      - refactor/skeleton-selection-manifest-compatibility
    paths:
      - .github/workflows/_oneoff_fix_selection_base_scoring.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/skeleton-selection-manifest-compatibility
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore legacy tag-only base scoring
        shell: python
        run: |
          from pathlib import Path
          p = Path('frontend/src/services/SkeletonRegistry.ts')
          s = p.read_text()
          s = s.replace("import {\n  evaluateSkeletonIntentCompatibility,\n  getIntentCompatibilityProfile,\n  scoreSkeletonCompatibility,\n} from './SkeletonSelectionCompatibility';", "import { evaluateSkeletonIntentCompatibility } from './SkeletonSelectionCompatibility';")
          old = '''function buildSkeletonSelectionScores(\n  input: string,\n  intentSignalMatches = detectIntentSignalMatches(input),\n): Array<[SkeletonId, number]> {\n  const scores = (Object.values(SKELETON_REGISTRY) as SkeletonMeta[])\n    .filter(skeleton => skeleton.available)\n    .map(skeleton => {\n      const tagScore = skeleton.tags.reduce(\n        (acc, tag) => acc + (input.includes(tag) ? 1 : 0),\n        0,\n      );\n      const compatibilityScore = intentSignalMatches.reduce((total, match) => {\n        const profile = getIntentCompatibilityProfile(match.signal);\n        if (!profile) return total;\n        const archetypeScore = Math.max(\n          ...profile.archetypes.map(archetype => scoreSkeletonCompatibility(skeleton.id, archetype)),\n        );\n        // One point of compatibility per matched intent keyword: enough to break\n        // conflicting semantic evidence without swamping the existing tag rank.\n        return total + (archetypeScore / 100) * match.matchedKeywords.length;\n      }, 0);\n      return [skeleton.id, tagScore + compatibilityScore] as [SkeletonId, number];\n    });\n\n  return scores.sort((a, b) => b[1] - a[1]);\n}\n'''
          new = '''function buildSkeletonSelectionScores(input: string): Array<[SkeletonId, number]> {\n  const scores = (Object.values(SKELETON_REGISTRY) as SkeletonMeta[])\n    .filter(skeleton => skeleton.available)\n    .map(skeleton => {\n      const tagScore = skeleton.tags.reduce(\n        (acc, tag) => acc + (input.includes(tag) ? 1 : 0),\n        0,\n      );\n      return [skeleton.id, tagScore] as [SkeletonId, number];\n    });\n\n  return scores.sort((a, b) => b[1] - a[1]);\n}\n'''
          if old not in s:
            raise SystemExit('expected scoring block not found')
          s = s.replace(old, new)
          s = s.replace('const scores = buildSkeletonSelectionScores(input, intentSignalMatches);', 'const scores = buildSkeletonSelectionScores(input);')
          p.write_text(s)

      - name: Remove one-off workflow
        run: rm .github/workflows/_oneoff_fix_selection_base_scoring.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/services/SkeletonRegistry.ts .github/workflows/_oneoff_fix_selection_base_scoring.yml
          git commit -m "fix: preserve tag-only skeleton base selection"
          git push origin HEAD:refactor/skeleton-selection-manifest-compatibility
