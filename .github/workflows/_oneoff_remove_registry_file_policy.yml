name: One-off remove Registry file policy
on:
  push:
    branches: [refactor/skeleton-registry-canonical-runtime]
    paths: ['.github/workflows/_oneoff_remove_registry_file_policy.yml']
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/skeleton-registry-canonical-runtime
      - name: Migrate Registry and manifests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          p = Path('frontend/src/services/SkeletonRegistry.ts')
          s = p.read_text()

          s = s.replace("  /** Relative paths (from skeleton src/) of files the BUILD agent MUST write */\n  deltaFiles: string[];\n  /** Glob prefixes the BUILD agent must NOT touch */\n  lockedPrefixes: string[];\n", "")

          s = s.replace("/** Transitional internal view while Registry consumers move to the canonical v2 compiler. */\ninterface SkeletonManifestOwnershipContract {\n  ownedBySkeleton?: string[];\n  productSlots?: string[];\n  skeletonOwned?: string[];\n  requiredProductSlots?: string[];\n  optionalProductSlots?: string[];\n  agentEditable?: string[];\n  agentReadOnly?: string[];\n  carcassFiles?: string[];\n}\n", "interface SkeletonManifestOwnershipContract {\n  skeletonOwned: string[];\n  requiredProductSlots: string[];\n  optionalProductSlots: string[];\n  agentEditable: string[];\n  agentReadOnly: string[];\n  carcassFiles: string[];\n}\n")

          s = s.replace("  editableFiles: string[];\n  deltaFiles: string[];\n  ownership?: SkeletonManifestOwnershipContract;\n", "  ownership: SkeletonManifestOwnershipContract;\n")
          s = s.replace("  carcassFiles?: string[];\n", "", 1)

          pattern = re.compile(r"\n    deltaFiles: \[\n.*?\n    \],\n    lockedPrefixes: \[\n.*?\n    \],", re.S)
          s, count = pattern.subn('', s)
          if count != 14:
              raise SystemExit(f'expected 14 Registry file-policy blocks, removed {count}')

          s = s.replace("  return uniqueSorted(manifest.editableFiles);", "  return uniqueSorted(manifest.ownership.agentEditable);")
          s = s.replace("  const explicit = manifest.ownership?.ownedBySkeleton;\n  if (explicit && explicit.length > 0) {\n    return uniqueSorted(explicit);\n  }", "  const explicit = manifest.ownership.skeletonOwned;\n  if (explicit.length > 0) {\n    return uniqueSorted(explicit);\n  }")
          s = s.replace("    productSlots: uniqueSorted(manifest?.ownership?.productSlots ?? manifest?.editableFiles ?? []),", "    productSlots: uniqueSorted(manifest?.ownership.agentEditable ?? []),")
          s = s.replace("    ...(manifest?.editableFiles ?? []),\n    ...(manifest?.deltaFiles ?? []),\n    ...(meta?.deltaFiles ?? []),", "    ...(manifest?.ownership.requiredProductSlots ?? []),\n    ...(manifest?.ownership.optionalProductSlots ?? []),\n    ...(manifest?.ownership.agentEditable ?? []),")
          s = s.replace("  const meta = SKELETON_REGISTRY[skeletonId];\n", "", 1)

          locked = re.compile(r"function isLockedSkeletonPath\(skeletonId: SkeletonId, path: string\): boolean \{.*?\n\}", re.S)
          s, n = locked.subn("function isLockedSkeletonPath(skeletonId: SkeletonId, path: string): boolean {\n  return isProtectedSkeletonFile(skeletonId, path);\n}", s, count=1)
          if n != 1:
              raise SystemExit('failed to replace isLockedSkeletonPath')

          s = s.replace("  const manifestDeltaFiles = manifest?.deltaFiles ?? s.deltaFiles;\n  const manifestEditableFiles = manifest?.editableFiles ?? s.deltaFiles;", "  const manifestDeltaFiles = manifest?.ownership.requiredProductSlots ?? [];\n  const manifestEditableFiles = manifest?.ownership.agentEditable ?? [];")

          if 'meta?.deltaFiles' in s or '.lockedPrefixes' in s or 's.deltaFiles' in s:
              raise SystemExit('legacy Registry policy reference remains')

          p.write_text(s)

          root = Path('frontend/src/services/skeleton-manifests')
          manifests = list(root.glob('*/skeleton.manifest.json'))
          if len(manifests) != 14:
              raise SystemExit(f'expected 14 manifests, found {len(manifests)}')
          for mp in manifests:
              data = json.loads(mp.read_text())
              data.pop('editableFiles', None)
              data.pop('deltaFiles', None)
              if data.get('version') != 2:
                  raise SystemExit(f'{mp}: expected v2')
              mp.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')

          test = Path('frontend/src/services/__tests__/SkeletonDeterministicMatrixSmoke.test.ts')
          t = test.read_text()
          marker = "describe('Skeleton deterministic matrix smoke — 14/14', () => {\n"
          invariant = "describe('Skeleton deterministic matrix smoke — 14/14', () => {\n  it('keeps Registry free of legacy file policy fields', async () => {\n    const source = await import('node:fs/promises').then(fs => fs.readFile(new URL('../SkeletonRegistry.ts', import.meta.url), 'utf8'));\n    expect(source).not.toContain('lockedPrefixes:');\n    expect(source).not.toContain('deltaFiles: string[]');\n  });\n\n"
          if marker not in t:
              raise SystemExit('matrix test marker not found')
          t = t.replace(marker, invariant, 1)
          test.write_text(t)
          PY

          rm .github/workflows/_oneoff_remove_registry_file_policy.yml
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/services/SkeletonRegistry.ts frontend/src/services/skeleton-manifests frontend/src/services/__tests__/SkeletonDeterministicMatrixSmoke.test.ts .github/workflows/_oneoff_remove_registry_file_policy.yml
          git commit -m 'refactor: remove Registry file-policy duplication'
          git push origin HEAD:refactor/skeleton-registry-canonical-runtime
