name: Diagnostic Mobile Pipeline After Validator

on:
  push:
    branches:
      - diag/mobile-pipeline-after-validator

permissions:
  contents: read

jobs:
  mobile-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main snapshot branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use mobile live-canary driver from PR 64
        run: git show f83337cbcd6b1a31f87fdbb4948a40c668a3581d:e2e/chat-generation-flow.spec.cjs > e2e/chat-generation-flow.spec.cjs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            preview-workspace/package.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install preview workspace dependencies
        run: npm install --prefix preview-workspace --no-package-lock

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run real mobile generation pipeline
        env:
          PLAYWRIGHT_PRODUCTION_ARTIFACT: '1'
          VITE_OPENROUTER_API_KEY: e2e-live-preview-key
          LIVE_CANARY_PROMPT: Build a mobile consumer habit tracking app with onboarding, bottom tab navigation, home feed, detail screen, create action, progress and profile.
        run: npm run test:e2e:preview-live

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-pipeline-diagnostics
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
