name: One-off Preview Hook Skeleton ID

on:
  push:
    branches:
      - refactor/validator-infrastructure-boundary
    paths:
      - .github/workflows/_oneoff_preview_hook_skeleton_id.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/validator-infrastructure-boundary
          fetch-depth: 0
      - name: Patch e2e preview hook
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/hooks/useStudio.ts')
          s = p.read_text(encoding='utf-8')
          old_sig = 'mountPreview: async (previewFiles: FileMap) => {'
          new_sig = 'mountPreview: async (previewFiles: FileMap, skeletonId?: string) => {'
          if s.count(old_sig) != 1:
              raise SystemExit(f'expected one mountPreview signature, got {s.count(old_sig)}')
          s = s.replace(old_sig, new_sig, 1)
          old_body = """          body: JSON.stringify({
            sessionId,
            files: Object.fromEntries("""
          new_body = """          body: JSON.stringify({
            sessionId,
            skeletonId,
            files: Object.fromEntries("""
          if s.count(old_body) != 1:
              raise SystemExit(f'expected one preview compile body, got {s.count(old_body)}')
          s = s.replace(old_body, new_body, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_oneoff_preview_hook_skeleton_id.yml
          git add frontend/src/hooks/useStudio.ts
          git commit -m "test: install selected skeleton in preview hook"
          git push origin HEAD:refactor/validator-infrastructure-boundary
