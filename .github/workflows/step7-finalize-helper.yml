name: Step 7 Finalize Helper

on:
  push:
    branches:
      - tmp/step7-canonical-selector
    paths:
      - .github/workflows/step7-finalize-helper.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/step7-canonical-selector
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Finalize legacy cleanup invariants
        run: |
          python - <<'PY'
          from pathlib import Path

          registry_path = Path('frontend/src/services/SkeletonRegistry.ts')
          registry = registry_path.read_text(encoding='utf-8')
          alias = """/**
           * Returns true if the given path falls under any of the skeleton's locked prefixes.
           */
          function isLockedSkeletonPath(skeletonId: SkeletonId, path: string): boolean {
            return isProtectedSkeletonFile(skeletonId, path);
          }

          """
          import textwrap
          alias = textwrap.dedent(alias)
          if registry.count(alias) != 1:
              raise SystemExit(f'isLockedSkeletonPath alias expected once, found {registry.count(alias)}')
          registry = registry.replace(alias, '')
          call = 'isLockedSkeletonPath(skeletonId, '
          if registry.count(call) != 2:
              raise SystemExit(f'isLockedSkeletonPath call expected twice, found {registry.count(call)}')
          registry = registry.replace(call, 'isProtectedSkeletonFile(skeletonId, ')
          registry_path.write_text(registry, encoding='utf-8')

          compiler_test_path = Path('frontend/src/services/__tests__/SkeletonContractCompiler.test.ts')
          compiler_test = compiler_test_path.read_text(encoding='utf-8')
          old_import = "import type { SkeletonId } from '../SkeletonRegistry';"
          new_import = "import { pathMatchesSkeletonPattern, type SkeletonId } from '../SkeletonRegistry';"
          if compiler_test.count(old_import) != 1:
              raise SystemExit('compiler test SkeletonRegistry type import not found exactly once')
          compiler_test = compiler_test.replace(old_import, new_import)
          needle = """    for (const protectedPath of contract.infrastructure.protected) {
              expect(pathExists(id, protectedPath), `${id} protected path does not exist: ${protectedPath}`).toBe(true);
            }

            expect(new Set(contract.editable).size).toBe(contract.editable.length);
          """
          needle = textwrap.dedent(needle)
          replacement = """    for (const protectedPath of contract.infrastructure.protected) {
              expect(pathExists(id, protectedPath), `${id} protected path does not exist: ${protectedPath}`).toBe(true);
            }

            for (const editablePath of contract.editable) {
              expect(
                contract.infrastructure.protected.some(pattern => pathMatchesSkeletonPattern(editablePath, pattern)),
                `${id} product slot must not also be protected: ${editablePath}`,
              ).toBe(false);
            }

            expect(new Set(contract.editable).size).toBe(contract.editable.length);
          """
          replacement = textwrap.dedent(replacement)
          if compiler_test.count(needle) != 1:
              raise SystemExit('compiler protected-path assertion insertion point not found exactly once')
          compiler_test = compiler_test.replace(needle, replacement)
          compiler_test_path.write_text(compiler_test, encoding='utf-8')

          matrix_path = Path('frontend/src/services/__tests__/SkeletonDeterministicMatrixSmoke.test.ts')
          matrix = matrix_path.read_text(encoding='utf-8')
          insertion_point = """  it('keeps output truth thresholds on canonical compiled required slots', async () => {
          """
          if matrix.count(insertion_point) != 1:
              raise SystemExit('matrix insertion point not found exactly once')
          new_test = """  it('centralizes product-delta write policy instead of duplicating validators', async () => {
            const fs = await import('node:fs/promises');
            const proto = await fs.readFile(new URL('../ProtoPipeline.ts', import.meta.url), 'utf8');
            const validator = await fs.readFile(new URL('../LiveGenerationContractValidator.ts', import.meta.url), 'utf8');
            const deltaContract = await fs.readFile(new URL('../ProductDeltaContract.ts', import.meta.url), 'utf8');

            expect(proto).toContain("from './ProductDeltaContract'");
            expect(proto).toContain('filterProductDeltaFiles');
            expect(validator).toContain("from './ProductDeltaContract'");
            expect(validator).toContain('getProductDeltaScope');
            expect(deltaContract).toContain('requiredSlots.map(normalizeProductDeltaPath)');
            expect(deltaContract).toContain('optionalSlots.map(normalizeProductDeltaPath)');
          });

          """
          matrix = matrix.replace(insertion_point, new_test + insertion_point)
          matrix_path.write_text(matrix, encoding='utf-8')

          for temp_path in [
              '.github/workflows/step7-selector-helper.yml',
              '.github/step7-selector-refactor.py',
              '.github/workflows/step7-finalize-helper.yml',
          ]:
              path = Path(temp_path)
              if path.exists():
                  path.unlink()
          PY

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Contract cleanup regression tests
        working-directory: frontend
        run: npm test -- --run src/services/__tests__/SkeletonContractCompiler.test.ts src/services/__tests__/SkeletonDeterministicMatrixSmoke.test.ts src/services/__tests__/SkeletonSelectionCanonical.test.ts src/services/__tests__/SkeletonSelectionManifestRuntime.test.ts
        env:
          VITE_OPENROUTER_API_KEY: placeholder
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Assert final cleanup surface
        run: |
          test ! -e frontend/src/services/SkeletonRuntimePolicy.ts
          test ! -e frontend/src/services/SkeletonQualityContract.ts
          test ! -e frontend/src/services/SkeletonSelectionCompatibility.ts
          test ! -e .github/workflows/step7-selector-helper.yml
          test ! -e .github/step7-selector-refactor.py
          test ! -e .github/workflows/step7-finalize-helper.yml
          if git grep -n -E 'getSkeletonInstalledFiles\(|getEditableSkeletonFiles\(|getSkeletonProductSlotFiles\(|getRequiredSkeletonDataFiles\(|getSkeletonQualityContract\(|isLockedSkeletonPath\(' -- frontend/src; then
            echo 'Legacy skeleton accessor call remains.' >&2
            exit 1
          fi
          if git grep -n -E '"agentEditable"|"agentReadOnly"' -- frontend/src/services/skeleton-manifests; then
            echo 'Legacy manifest ownership mirror remains.' >&2
            exit 1
          fi
          git diff --check

      - name: Commit final Step 7 cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(skeletons): finalize legacy policy cleanup'
          git push origin HEAD:tmp/step7-canonical-selector
