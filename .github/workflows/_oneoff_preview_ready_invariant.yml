name: One-off Preview Ready Invariant

on:
  push:
    branches:
      - refactor/validator-infrastructure-boundary
    paths:
      - .github/workflows/_oneoff_preview_ready_invariant.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/validator-infrastructure-boundary
          fetch-depth: 0
      - name: Patch preview ready invariant
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('backend/preview-manager.ts')
          s = p.read_text(encoding='utf-8')
          old = """        await cleanupLRU();
        setPreviewBuildStatus({
          buildId,
          status: 'ready',
"""
          new = """        await cleanupLRU();
        const builtIndexPath = path.join(BUILDS_WORKSPACE, buildId, 'index.html');
        if (!fs.existsSync(builtIndexPath)) {
          throw new Error(`Preview build artifact missing after compile: ${builtIndexPath}`);
        }
        setPreviewBuildStatus({
          buildId,
          status: 'ready',
"""
          if old not in s:
              raise SystemExit('target block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_oneoff_preview_ready_invariant.yml
          git add backend/preview-manager.ts
          git commit -m "fix: require preview artifact before ready"
          git push origin HEAD:refactor/validator-infrastructure-boundary
