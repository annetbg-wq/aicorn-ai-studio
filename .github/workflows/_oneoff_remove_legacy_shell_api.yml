name: Remove legacy shell ownership API

on:
  push:
    branches:
      - refactor/remove-legacy-shell-ownership-api
    paths:
      - ".github/workflows/_oneoff_remove_legacy_shell_api.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/remove-legacy-shell-ownership-api
          fetch-depth: 0

      - name: Apply exact cleanup
        run: node scripts/remove-legacy-shell-ownership-api.mjs

      - name: Commit clean result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/services/SkeletonRegistry.ts
          git rm scripts/remove-legacy-shell-ownership-api.mjs
          git rm .github/workflows/_oneoff_remove_legacy_shell_api.yml
          git commit -m "refactor: remove legacy shell ownership API"
          git push origin HEAD:refactor/remove-legacy-shell-ownership-api
