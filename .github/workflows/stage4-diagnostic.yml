name: Stage4 Apply

on:
  push:
    branches:
      - refactor/product-delta-generation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/product-delta-generation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply deterministic product-delta boundary
        run: python scripts/stage4_product_delta_patch.py
      - name: Finish Stage 4 invariants
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          pipeline = Path('frontend/src/services/ProtoPipeline.ts')
          text = pipeline.read_text()
          old = "warnings: droppedProtected > 0 ? [`${droppedProtected} protected file(s) ignored`] : undefined"
          new = "warnings: productDeltaFilter.rejected.length > 0 ? [`${productDeltaFilter.rejected.length} out-of-scope file(s) ignored`] : undefined"
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 legacy droppedProtected telemetry references, found {count}')
          pipeline.write_text(text.replace(old, new))

          matrix = Path('frontend/src/services/__tests__/SkeletonDeterministicMatrixSmoke.test.ts')
          matrix_text = matrix.read_text()
          old_assert = "    expect(productSlots).toEqual(policy.editable);"
          new_assert = "    expect(productSlots).toEqual([...new Set([...policy.requiredSlots, ...policy.optionalSlots])].sort((a, b) => a.localeCompare(b)));"
          if matrix_text.count(old_assert) != 1:
              raise SystemExit('expected exactly one legacy productSlots === editable invariant')
          matrix.write_text(matrix_text.replace(old_assert, new_assert, 1))
          PY
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Typecheck and targeted Stage 4 tests
        shell: bash
        env:
          VITE_OPENROUTER_API_KEY: placeholder
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
        run: |
          cd frontend
          npx tsc --noEmit
          npx vitest run \
            src/services/__tests__/ProductDeltaContract.test.ts \
            src/services/__tests__/SkeletonDeterministicMatrixSmoke.test.ts \
            src/services/__tests__/ProtoPipeline.test.ts
      - name: Commit clean Stage 4 code
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: constrain generation to product slots"
          git push origin HEAD:refactor/product-delta-generation
