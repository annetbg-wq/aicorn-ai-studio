name: Stage4 Apply

on:
  push:
    branches:
      - refactor/product-delta-generation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/product-delta-generation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply deterministic product-delta boundary
        run: python scripts/stage4_product_delta_patch.py
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Typecheck and targeted Stage 4 tests
        shell: bash
        run: |
          cd frontend
          npx tsc --noEmit
          npx vitest run \
            src/services/__tests__/ProductDeltaContract.test.ts \
            src/services/__tests__/SkeletonDeterministicMatrixSmoke.test.ts \
            src/services/__tests__/ProtoPipeline.test.ts
      - name: Commit clean Stage 4 code
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: constrain generation to product slots"
          git push origin HEAD:refactor/product-delta-generation
