name: One-off reusable shell consumption fix

on:
  push:
    branches: [test/live-preview-canary-matrix]
    paths: [.github/workflows/_oneoff_reusable_shell_consumption_fix.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/live-preview-canary-matrix
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch shell-consumption semantics and terminal polling
        shell: python
        run: |
          from pathlib import Path
          import base64
          dec = lambda value: base64.b64decode(value).decode()
          validator = Path('frontend/src/services/LiveGenerationContractValidator.ts')
          source = validator.read_text()
          old = dec('')
          new = dec('')
          if old not in source: raise SystemExit('blanket shellOwned import block not found')
          validator.write_text(source.replace(old, new))
          test = Path('frontend/src/services/__tests__/LiveGenerationContractManifestOwnership.test.ts')
          source = test.read_text()
          marker = dec('ICBpdCgnc3RpbGwgYmxvY2tzIHBhZ2UtbGV2ZWwgcm91dGVyIG93bmVyc2hpcCBBUElzJywgKCkgPT4gewo=')
          insert = dec('')
          if marker not in source: raise SystemExit('test marker not found')
          if 'allows product pages to consume reusable read-only skeleton components' not in source:
            test.write_text(source.replace(marker, insert + marker))
          e2e = Path('e2e/chat-generation-flow.spec.cjs')
          source = e2e.read_text()
          old = dec('')
          new = dec('')
          if old not in source: raise SystemExit('status polling block not found')
          e2e.write_text(source.replace(old, new))
      - name: Remove one-off workflow
        run: rm .github/workflows/_oneoff_reusable_shell_consumption_fix.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/services/LiveGenerationContractValidator.ts frontend/src/services/__tests__/LiveGenerationContractManifestOwnership.test.ts e2e/chat-generation-flow.spec.cjs .github/workflows/_oneoff_reusable_shell_consumption_fix.yml
          git commit -m "fix: distinguish shell consumption from shell ownership"
          git push origin HEAD:test/live-preview-canary-matrix
