              - generic [ref=e725]: "## Деньги в порядке _Простой и наглядный трекер личных финансов с доходами, расходами, категориями и графиками_ **Target user:** Человек 25–40 лет, который хочет контролировать личные финансы, но устал от сложных банковских приложений и таблиц. Открывает приложение после зарплаты или в конце месяца, чтобы понять, куда ушли деньги. ### Product Strategy - **Core action:** Добавить транзакцию (доход или расход) за 10 секунд - **Retention:** Еженедельная сводка расходов и визуальные графики, показывающие динамику — пользователь возвращается, чтобы увидеть, как меняются его финансы - **Monetization:** Пользователь пытается установить бюджет на категорию или экспортировать данные в CSV ### Screens 1. **Page1** — Персонализация приложения под пользователя — сбор информации о доходе и категориях _()_ 2. **Page2** — Общий обзор финансов: баланс, графики, последние транзакции _()_ 3. **Page3** — Просмотр, фильтрация и управление всеми транзакциями _()_ 4. **Page4** — Быстрое добавление дохода или расхода _()_ 5. **Page5** — Управление категориями доходов и расходов _()_ 6. **Page6** — Детальная аналитика расходов и доходов _()_ 7. **Page7** — Управление профилем, подпиской, языком и данными _()_ ### Design Direction - **Visual archetype:** focused utility shell - **Density / breathing room:** comfortable / balanced - **Shell style:** Lean product shell with direct task framing, limited navigation, and highly legible work surfaces. Preserve the recognizable page scaffolding while refreshing visual expression. - **Hierarchy emphasis:** Lead with the task and result, not with decorative scene-setting. - **Content rhythm:** Compact sections, clear labels, and repeated component logic that supports fast comprehension. - **CTA strategy:** Keep one obvious primary action and reduce secondary clutter. - **Imagery strategy:** Use imagery sparingly; prefer diagrams, icons, or self-contained visual accents. - **Motion strategy:** Use subtle fades, hover lifts, and state transitions that make the interface feel intentional without stealing attention. - **Mobile composition:** Use one dominant column, progressive disclosure for settings, and sticky submission or apply actions. - **Avoid:** Avoid unnecessary marketing chrome around core tasks. | Do not introduce multiple visual metaphors on one screen. | Avoid ornamental motion that slows repeat use. ### Redesign Intent - **Mode:** preserve - **Structure lock:** strict - **Change envelope:** greenfield_foundation - **Visual system reset:** false - **Screens in scope:** Page5, Page6 - **Brand anchors:** Деньги в порядке naming and product promise | existing dark-slate theme expectations | current navigation labels for Page5, Page6 | existing information architecture | recognizable brand accents and tone ### Asset Policy - **Components:** shadcn/ui primitives, studio block components, project-local composed components - **Icons:** lucide-react, local inline SVG for brand marks only - **Media:** avoid — Default to self-contained gradients, illustrations, or shaped placeholders so the preview remains stable and coherent. - **Fonts:** local_preferred — fallbacks Inter, system-ui, sans-serif - **Advanced resources:** CSS gradients, inline SVG patterns, data URI textures, Framer Motion, local illustration wrappers - **Preview-safe fallback:** Maintain self-contained gradients, patterns, or framed placeholders when remote media is avoided or unavailable."
