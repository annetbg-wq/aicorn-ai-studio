              - generic [ref=e880]: "## Сон и восстановление _Персонализированные рекомендации для улучшения качества сна и восстановления._ **Target user:** Люди, стремящиеся улучшить качество сна и справиться со стрессом. ### Screens 1. **Home** — Главный экран для отображения рекомендаций и анализа сна. 2. **Settings** — Preferences and configuration ### Design Direction - **Visual archetype:** editorial storytelling canvas - **Density / breathing room:** spacious / airy - **Shell style:** Narrative shell with restrained navigation, long-form sections, and clear feature pacing. Preserve the recognizable page scaffolding while refreshing visual expression. - **Hierarchy emphasis:** Lead with a strong headline or hero frame, then unfold supporting modules with deliberate whitespace. - **Content rhythm:** Long-form sections, asymmetrical cards, and alternating feature modules with occasional full-bleed moments. - **CTA strategy:** Use fewer, better CTAs tied to trust or conversion moments instead of constant repeated buttons. - **Imagery strategy:** Use high-weight editorial imagery, product mockups, or creator visuals where they meaningfully carry the story. - **Motion strategy:** Use subtle fades, hover lifts, and state transitions that make the interface feel intentional without stealing attention. - **Mobile composition:** Keep a single reading column, compress navigation, and preserve a clean content stack with one sticky conversion action. - **Avoid:** Avoid dashboard-style clutter and repetitive equal-weight cards. | Do not turn narrative sections into generic marketing blocks. | Avoid decorative color noise that fights typography. ### Redesign Intent - **Mode:** preserve - **Structure lock:** strict - **Change envelope:** greenfield_foundation - **Visual system reset:** false - **Screens in scope:** Home, Settings - **Brand anchors:** Сон и восстановление naming and product promise | existing warm theme expectations | current navigation labels for Home, Settings | existing information architecture | recognizable brand accents and tone ### Asset Policy - **Components:** shadcn/ui primitives, studio block components, project-local composed components - **Icons:** lucide-react, local inline SVG for brand marks only - **Media:** avoid — Default to self-contained gradients, illustrations, or shaped placeholders so the preview remains stable and coherent. - **Fonts:** local_preferred — fallbacks Inter, system-ui, sans-serif - **Advanced resources:** CSS gradients, inline SVG patterns, data URI textures, Framer Motion, local illustration wrappers - **Preview-safe fallback:** Maintain self-contained gradients, patterns, or framed placeholders when remote media is avoided or unavailable."
