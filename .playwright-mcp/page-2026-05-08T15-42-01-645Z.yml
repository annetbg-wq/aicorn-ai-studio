              - generic [ref=e709]: "## Привычка _Простой ежедневный трекер привычек с подсчётом серий и графиком прогресса_ **Target user:** Человек, который хочет выработать полезные привычки (спорт, чтение, медитация), но теряет мотивацию без видимого прогресса и серий. Открывает приложение утром, чтобы отметить выполненные вчера привычки и запланировать сегодняшние. ### Product Strategy - **Core action:** Отметить привычку как выполненную сегодня - **Retention:** Страх потерять серию (streak) заставляет возвращаться каждый день. Вид растущей серии и графика прогресса даёт дофаминовое подкрепление. - **Monetization:** Пользователь пытается добавить 6-ю привычку ### Screens 1. **Onboarding** — Настройка первых 3 привычек и времени напоминания _()_ 2. **Page2** — Отметка выполненных привычек на сегодня, просмотр серий _()_ 3. **Page3** — Просмотр графиков выполнения и истории серий _()_ 4. **Page4** — Создание новой привычки с названием, эмодзи и цветом _()_ 5. **Page5** — Настройки профиля, подписка, язык, экспорт _()_ ### Design Direction - **Visual archetype:** calm guided coaching space - **Density / breathing room:** spacious / airy - **Shell style:** Soft guidance shell with clear progress anchors, reassuring surfaces, and low-stress navigation. - **Hierarchy emphasis:** Lead with current state, progress, and the next supportive step rather than with dense controls. - **Content rhythm:** Breathing sections, rounded cards, and one primary ritual or progress module per viewport. Let color changes reinforce task states and progression. - **CTA strategy:** Use clear action verbs, visible progress, and occasional celebration moments anchored to meaningful user wins. - **Imagery strategy:** Use warm, human imagery or gentle abstraction only where it improves empathy and trust. - **Motion strategy:** Use expressive motion for celebration, emphasis, and spatial continuity, but keep primary workflows readable and performant. - **Mobile composition:** Favor single-column flows, comfortable spacing, sticky progress or action anchors, and reduced decision load per screen. - **Avoid:** Avoid cold enterprise density and overly technical UI language. | Do not over-animate moments that should feel calm and safe. | Avoid harsh contrast combinations that feel clinical unless the domain requires it. | Avoid novelty visuals that are not tied to an action, state, or reward. ### Redesign Intent - **Mode:** preserve - **Structure lock:** strict - **Change envelope:** greenfield_foundation - **Visual system reset:** false - **Screens in scope:** Page3 - **Brand anchors:** Привычка naming and product promise | existing dark-slate theme expectations | current navigation labels for Page3 | existing information architecture | recognizable brand accents and tone ### Asset Policy - **Components:** shadcn/ui primitives, studio block components, project-local composed components - **Icons:** lucide-react, local inline SVG for brand marks only - **Media:** avoid — Default to self-contained gradients, illustrations, or shaped placeholders so the preview remains stable and coherent. - **Fonts:** local_preferred — fallbacks Inter, system-ui, sans-serif - **Advanced resources:** CSS gradients, inline SVG patterns, data URI textures, Framer Motion, local illustration wrappers - **Preview-safe fallback:** Maintain self-contained gradients, patterns, or framed placeholders when remote media is avoided or unavailable."
