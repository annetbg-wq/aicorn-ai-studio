              - generic [ref=e344]: "## TaskFlow _Простой и быстрый планировщик задач: добавляй, отмечай и удаляй_ **Target user:** Занятый человек, которому нужен простой список дел без навороченных функций. Открывает приложение чтобы быстро записать задачу и не забыть о важном. ### Product Strategy - **Core action:** Добавить новую задачу и отметить её как выполненную - **Retention:** Ежедневная привычка записывать и вычёркивать задачи — чувство продуктивности возвращает пользователя - **Monetization:** Лимит в 20 бесплатных задач или попытка сменить тему ### Screens 1. **Page1** — Первое знакомство с приложением _()_ 2. **Page2** — Основной экран: список всех задач, добавление новых _()_ 3. **Page3** — Просмотр выполненных задач _()_ 4. **Page4** — Настройки профиля, подписка, язык _()_ ### Design Direction - **Visual archetype:** focused utility shell - **Density / breathing room:** comfortable / balanced - **Shell style:** Lean product shell with direct task framing, limited navigation, and highly legible work surfaces. Preserve the recognizable page scaffolding while refreshing visual expression. - **Hierarchy emphasis:** Lead with the task and result, not with decorative scene-setting. - **Content rhythm:** Compact sections, clear labels, and repeated component logic that supports fast comprehension. - **CTA strategy:** Keep one obvious primary action and reduce secondary clutter. - **Imagery strategy:** Use imagery sparingly; prefer diagrams, icons, or self-contained visual accents. - **Motion strategy:** Use subtle fades, hover lifts, and state transitions that make the interface feel intentional without stealing attention. - **Mobile composition:** Use one dominant column, progressive disclosure for settings, and sticky submission or apply actions. - **Avoid:** Avoid unnecessary marketing chrome around core tasks. | Do not introduce multiple visual metaphors on one screen. | Avoid ornamental motion that slows repeat use. ### Redesign Intent - **Mode:** preserve - **Structure lock:** strict - **Change envelope:** greenfield_foundation - **Visual system reset:** false - **Screens in scope:** Page2, Page3, Page4 - **Brand anchors:** TaskFlow naming and product promise | existing dark-slate theme expectations | current navigation labels for Page2, Page3, Page4 | existing information architecture | recognizable brand accents and tone ### Asset Policy - **Components:** shadcn/ui primitives, studio block components, project-local composed components - **Icons:** lucide-react, local inline SVG for brand marks only - **Media:** avoid — Default to self-contained gradients, illustrations, or shaped placeholders so the preview remains stable and coherent. - **Fonts:** local_preferred — fallbacks Inter, system-ui, sans-serif - **Advanced resources:** CSS gradients, inline SVG patterns, data URI textures, Framer Motion, local illustration wrappers - **Preview-safe fallback:** Maintain self-contained gradients, patterns, or framed placeholders when remote media is avoided or unavailable."
