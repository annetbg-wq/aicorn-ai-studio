                - generic [ref=e649]: 2 screens · dark-slate theme
              - generic [ref=e651]: "## Сон и восстановление _Персонализированные рекомендации для улучшения качества сна и восстановления._ **Target user:** Люди, стремящиеся улучшить качество своего сна и восстановление после стресса. ### Product Strategy - **Core action:** Получение персонализированных рекомендаций по улучшению сна. - **Retention:** Пользователи возвращаются для отслеживания прогресса и получения новых рекомендаций. - **Monetization:** После достижения первых результатов в улучшении сна. ### Screens 1. **Dashboard** — Пользователь видит сводку своих привычек сна и рекомендации. _()_ 2. **Page2** — Пользователь получает персонализированные рекомендации по улучшению сна. _()_ ### Design Direction - **Visual archetype:** operator cockpit - **Density / breathing room:** compact / compressed - **Shell style:** Persistent workspace shell with strong navigation, utility header, and decision-focused content zones. Preserve the recognizable page scaffolding while refreshing visual expression. - **Hierarchy emphasis:** Lead with active KPIs, queues, and next actions before secondary storytelling. - **Content rhythm:** Alternating metric cards, list-detail panels, and dense table or timeline sections. - **CTA strategy:** One authoritative primary action per screen with utility actions nearby but visually quieter. - **Imagery strategy:** Favor product states, charts, status chips, and diagrams over decorative photography. - **Motion strategy:** Use subtle fades, hover lifts, and state transitions that make the interface feel intentional without stealing attention. - **Mobile composition:** Collapse to one dominant column, preserve the primary action above the fold, and move navigation into bottom tabs or a drawer. - **Avoid:** Do not let decorative hero art hide operational data. | Avoid oversized card chrome that reduces scan speed. | Avoid mixing multiple competing accent systems on one screen. ### Redesign Intent - **Mode:** preserve - **Structure lock:** strict - **Change envelope:** greenfield_foundation - **Visual system reset:** false - **Screens in scope:** Dashboard, Page2 - **Brand anchors:** Сон и восстановление naming and product promise | existing dark-slate theme expectations | current navigation labels for Dashboard, Page2 | existing information architecture | recognizable brand accents and tone ### Asset Policy - **Components:** shadcn/ui primitives, studio block components, project-local composed components - **Icons:** lucide-react, local inline SVG for brand marks only - **Media:** avoid — Default to self-contained gradients, illustrations, or shaped placeholders so the preview remains stable and coherent. - **Fonts:** local_preferred — fallbacks Inter, system-ui, sans-serif - **Advanced resources:** CSS gradients, inline SVG patterns, data URI textures, Framer Motion, local illustration wrappers - **Preview-safe fallback:** Maintain self-contained gradients, patterns, or framed placeholders when remote media is avoided or unavailable."
