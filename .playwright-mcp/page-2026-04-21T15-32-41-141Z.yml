              - generic [ref=e672]: "## EcoHome _An app that helps homeowners track and reduce their carbon footprint through actionable insights and tips._ **Target user:** Homeowners who want to reduce their carbon footprint and seek actionable insights. ### Product Strategy - **Core action:** Tracking and managing carbon footprint. - **Retention:** Ongoing tips, reminders, and progress tracking. ### Screens 1. **Dashboard** — Overview of user's carbon footprint and quick tips for reduction. _()_ 2. **CarbonFootprintTracker** — Allows users to input data to track their carbon footprint. _()_ 3. **TipsInsights** — Provides actionable insights and tips for reducing carbon footprint. _()_ 4. **ProgressReport** — Displays user's progress in reducing their carbon footprint. _()_ 5. **Settings** — Allows users to adjust app preferences. _()_ ### Design Direction - **Visual archetype:** focused utility shell - **Density / breathing room:** comfortable / balanced - **Shell style:** Lean product shell with direct task framing, limited navigation, and highly legible work surfaces. Preserve the recognizable page scaffolding while refreshing visual expression. - **Hierarchy emphasis:** Lead with the task and result, not with decorative scene-setting. - **Content rhythm:** Compact sections, clear labels, and repeated component logic that supports fast comprehension. - **CTA strategy:** Keep one obvious primary action and reduce secondary clutter. - **Imagery strategy:** Use imagery sparingly; prefer diagrams, icons, or self-contained visual accents. - **Motion strategy:** Use subtle fades, hover lifts, and state transitions that make the interface feel intentional without stealing attention. - **Mobile composition:** Use one dominant column, progressive disclosure for settings, and sticky submission or apply actions. - **Avoid:** Avoid unnecessary marketing chrome around core tasks. | Do not introduce multiple visual metaphors on one screen. | Avoid ornamental motion that slows repeat use. ### Redesign Intent - **Mode:** preserve - **Structure lock:** strict - **Change envelope:** greenfield_foundation - **Visual system reset:** false - **Screens in scope:** TipsInsights - **Brand anchors:** EcoHome naming and product promise | existing trust theme expectations | current navigation labels for TipsInsights | existing information architecture | recognizable brand accents and tone ### Asset Policy - **Components:** shadcn/ui primitives, studio block components, project-local composed components - **Icons:** lucide-react, local inline SVG for brand marks only - **Media:** avoid — Default to self-contained gradients, illustrations, or shaped placeholders so the preview remains stable and coherent. - **Fonts:** local_preferred — fallbacks Inter, system-ui, sans-serif - **Advanced resources:** CSS gradients, inline SVG patterns, data URI textures, Framer Motion, local illustration wrappers - **Preview-safe fallback:** Maintain self-contained gradients, patterns, or framed placeholders when remote media is avoided or unavailable."
