              - generic [ref=e396]: "## Трекер расходов _Простой и быстрый трекер личных расходов с категориями и графиком трат по месяцам_ **Target user:** Молодой специалист 25-40 лет, который хочет быстро записывать расходы и видеть, куда уходят деньги. Открывает приложение после каждой покупки. ### Product Strategy - **Core action:** Добавить расход с категорией и суммой - **Retention:** Ежедневное добавление расходов + ежемесячный график, показывающий динамику трат - **Monetization:** После 3-го добавленного расхода ### Screens 1. **Onboarding** — Настройка профиля и категорий при первом запуске _()_ 2. **Page2** — Просмотр графика расходов за месяц и списка последних операций _()_ 3. **Page3** — Быстрое добавление нового расхода _()_ 4. **Page4** — Управление категориями расходов _()_ 5. **Page5** — Управление профилем, подпиской и языком _()_ ### Design Direction - **Visual archetype:** focused utility shell - **Density / breathing room:** comfortable / balanced - **Shell style:** Lean product shell with direct task framing, limited navigation, and highly legible work surfaces. Preserve the recognizable page scaffolding while refreshing visual expression. - **Hierarchy emphasis:** Lead with the task and result, not with decorative scene-setting. - **Content rhythm:** Compact sections, clear labels, and repeated component logic that supports fast comprehension. - **CTA strategy:** Keep one obvious primary action and reduce secondary clutter. - **Imagery strategy:** Use imagery sparingly; prefer diagrams, icons, or self-contained visual accents. - **Motion strategy:** Use subtle fades, hover lifts, and state transitions that make the interface feel intentional without stealing attention. - **Mobile composition:** Use one dominant column, progressive disclosure for settings, and sticky submission or apply actions. - **Avoid:** Avoid unnecessary marketing chrome around core tasks. | Do not introduce multiple visual metaphors on one screen. | Avoid ornamental motion that slows repeat use. ### Redesign Intent - **Mode:** preserve - **Structure lock:** strict - **Change envelope:** greenfield_foundation - **Visual system reset:** false - **Screens in scope:** Page4 - **Brand anchors:** Трекер расходов naming and product promise | existing dark-slate theme expectations | current navigation labels for Page4 | existing information architecture | recognizable brand accents and tone ### Asset Policy - **Components:** shadcn/ui primitives, studio block components, project-local composed components - **Icons:** lucide-react, local inline SVG for brand marks only - **Media:** avoid — Default to self-contained gradients, illustrations, or shaped placeholders so the preview remains stable and coherent. - **Fonts:** local_preferred — fallbacks Inter, system-ui, sans-serif - **Advanced resources:** CSS gradients, inline SVG patterns, data URI textures, Framer Motion, local illustration wrappers - **Preview-safe fallback:** Maintain self-contained gradients, patterns, or framed placeholders when remote media is avoided or unavailable."
