              - generic [ref=e715]: "## Расходы — Простой трекер расходов _Быстро записывайте расходы, следите за месячным бюджетом и анализируйте траты по категориям_ **Target user:** Человек, который только что совершил покупку и хочет быстро записать её, чтобы контролировать бюджет. Не хочет сложных бухгалтерских инструментов — нужна простота и наглядность. ### Product Strategy - **Core action:** Записать расход с суммой и категорией - **Retention:** Ежемесячный обзор трат мотивирует возвращаться и следить за динамикой. Каждый новый расход обновляет общую картину. - **Monetization:** Попытка открыть историю за предыдущий месяц или экспортировать данные ### Screens 1. **Page1** — Просмотр общей суммы расходов за месяц, распределения по категориям и списка последних трат _()_ 2. **Page2** — Быстрая запись нового расхода _()_ 3. **Page3** — Управление категориями расходов: просмотр, добавление, редактирование, удаление _()_ 4. **Page4** — Управление профилем, подпиской, языком и настройками приложения _()_ 5. **Page5** — Просмотр всех расходов за выбранный месяц с фильтрацией и поиском _()_ ### Design Direction - **Visual archetype:** focused utility shell - **Density / breathing room:** comfortable / balanced - **Shell style:** Lean product shell with direct task framing, limited navigation, and highly legible work surfaces. Preserve the recognizable page scaffolding while refreshing visual expression. - **Hierarchy emphasis:** Lead with the task and result, not with decorative scene-setting. - **Content rhythm:** Compact sections, clear labels, and repeated component logic that supports fast comprehension. - **CTA strategy:** Keep one obvious primary action and reduce secondary clutter. - **Imagery strategy:** Use imagery sparingly; prefer diagrams, icons, or self-contained visual accents. - **Motion strategy:** Use subtle fades, hover lifts, and state transitions that make the interface feel intentional without stealing attention. - **Mobile composition:** Use one dominant column, progressive disclosure for settings, and sticky submission or apply actions. - **Avoid:** Avoid unnecessary marketing chrome around core tasks. | Do not introduce multiple visual metaphors on one screen. | Avoid ornamental motion that slows repeat use. ### Redesign Intent - **Mode:** preserve - **Structure lock:** strict - **Change envelope:** greenfield_foundation - **Visual system reset:** false - **Screens in scope:** Page3 - **Brand anchors:** Расходы — Простой трекер расходов naming and product promise | existing dark-slate theme expectations | current navigation labels for Page3 | existing information architecture | recognizable brand accents and tone ### Asset Policy - **Components:** shadcn/ui primitives, studio block components, project-local composed components - **Icons:** lucide-react, local inline SVG for brand marks only - **Media:** avoid — Default to self-contained gradients, illustrations, or shaped placeholders so the preview remains stable and coherent. - **Fonts:** local_preferred — fallbacks Inter, system-ui, sans-serif - **Advanced resources:** CSS gradients, inline SVG patterns, data URI textures, Framer Motion, local illustration wrappers - **Preview-safe fallback:** Maintain self-contained gradients, patterns, or framed placeholders when remote media is avoided or unavailable."
