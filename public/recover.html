<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AI Studio - Emergency Recovery</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #050505; color: #fff; font-family: sans-serif; padding: 40px; }
        .card { background: #111; border: 1px solid #333; padding: 20px; border-radius: 8px; max-width: 500px; margin: 0 auto; }
        button { background: #4f46e5; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background: #4338ca; }
        .status { margin-top: 20px; font-size: 12px; color: #888; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Восстановление системы</h2>
        <p>Эта панель загрузит последнюю стабильную версию файлов прямо из Supabase, игнорируя локальные ошибки.</p>
        <button id="restoreBtn">ОТКАТИТЬ К ПОСЛЕДНЕМУ СОХРАНЕНИЮ</button>
        <div id="status" class="status">Ожидание команды...</div>
    </div>

    <script>
        // Данные берем из твоего .env или напрямую (для админки допустимо)
        const SUPABASE_URL = 'ТВОЙ_URL';
        const SUPABASE_KEY = 'ТВОЙ_KEY';
        const supabase = lib.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('restoreBtn').onclick = async () => {
            const btn = document.getElementById('restoreBtn');
            const status = document.getElementById('status');
            
            btn.disabled = true;
            status.innerText = 'Связь с базой...';

            try {
                // 1. Получаем последний проект
                const { data, error } = await supabase
                    .from('projects')
                    .select('id, files')
                    .order('updated_at', { ascending: false })
                    .limit(1)
                    .single();

                if (error) throw error;

                // 2. Самый важный момент: принудительно пишем в LocalStorage, 
                // который использует твой useStudio при загрузке.
                localStorage.setItem('aic_files_backup', JSON.stringify(data.files));
                
                status.style.color = '#4ade80';
                status.innerText = 'УСПЕХ! Данные восстановлены в кэш. Перенаправление...';
                
                setTimeout(() => {
                    window.location.href = '/'; // Возвращаемся в приложение
                }, 1500);

            } catch (err) {
                status.style.color = '#ef4444';
                status.innerText = 'Ошибка: ' + err.message;
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
